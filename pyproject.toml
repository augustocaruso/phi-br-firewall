[project]
name = "phi-br-presidio-firewall"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "presidio-analyzer",
  "presidio-anonymizer",
  "pydantic>=2",
  "pyyaml",
  "typer",
  "rich",
]

[project.scripts]
phi = "phi_br_core.cli.main:app"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
  "mypy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/phi_br_core/phi_br_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/phi_br_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["phi_br_core"]
